<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>note Dark</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="heading">
        <div class="mark" aria-hidden="true">n</div>
        <div>
          <h1>note Dark</h1>
          <p id="status">ダークモードはオン</p>
        </div>
      </div>

      <label class="toggle-row" for="enabled">
        <span>note とエディタを暗くする</span>
        <span class="switch">
          <input id="enabled" type="checkbox" checked>
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>

      <section class="color-panel" aria-labelledby="background-heading">
        <div class="color-heading">
          <div>
            <h2 id="background-heading">背景色</h2>
            <output id="rgb-value" for="red green blue">rgb(16, 19, 21)</output>
          </div>
          <span id="color-preview" class="color-preview" aria-hidden="true"></span>
        </div>

        <div class="rgb-grid">
          <label for="red">
            <span>R</span>
            <input id="red" name="red" type="number" inputmode="numeric" min="0" max="255" step="1" value="16">
          </label>
          <label for="green">
            <span>G</span>
            <input id="green" name="green" type="number" inputmode="numeric" min="0" max="255" step="1" value="19">
          </label>
          <label for="blue">
            <span>B</span>
            <input id="blue" name="blue" type="number" inputmode="numeric" min="0" max="255" step="1" value="21">
          </label>
        </div>

        <button id="reset-color" class="reset-button" type="button">初期値に戻す</button>
      </section>

      <p class="hint">設定は開いている note と editor.note.com にすぐ反映される。明るい背景色では文字が読みづらくなる場合がある。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
