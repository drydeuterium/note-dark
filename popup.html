<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>note Dark</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="heading">
        <div class="mark" aria-hidden="true">n</div>
        <div>
          <h1>note Dark</h1>
          <p id="status">ダークモードはオン</p>
        </div>
      </div>

      <label class="toggle-row" for="enabled">
        <span>note.com を暗くする</span>
        <span class="switch">
          <input id="enabled" type="checkbox" checked>
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>

      <p class="hint">設定は開いている note のタブにもすぐ反映される。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
