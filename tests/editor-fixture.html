<!doctype html>
<html lang="ja" class="theme-auto" data-note-dark-enabled="true" data-note-dark-site="editor" style="--note-dark-custom-bg: rgb(24, 31, 38)">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>note Dark editor fixture</title>
    <link rel="stylesheet" href="../dark.css">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #__next { display: grid; grid-template: 64px 1fr / 300px 1fr; min-height: 100vh; }
      header { grid-column: 1 / -1; padding: 18px 24px; border-bottom: 1px solid var(--color-border-default); }
      aside { padding: 28px; border-right: 1px solid var(--color-border-default); }
      main { padding: 72px 10vw; background: var(--color-background-primary); }
      [contenteditable="true"] { min-height: 160px; padding: 24px 0; outline: none; }
      button { padding: 8px 14px; color: var(--color-text-primary); background: var(--color-surface-normal); border: 1px solid var(--color-border-default); border-radius: 8px; }
    </style>
  </head>
  <body>
    <div id="__next">
      <header>閉じる <button type="button">下書き保存</button></header>
      <aside><h2>目次</h2><p>見出しを設定すると表示されます</p></aside>
      <main>
        <h1>記事タイトル</h1>
        <div class="ProseMirror" contenteditable="true"><p>本文を入力する</p><pre data-name="preCode"><code>const editor = "dark";</code></pre></div>
      </main>
    </div>
  </body>
</html>
