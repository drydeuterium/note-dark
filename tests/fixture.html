<!doctype html>
<html lang="ja" data-note-dark-enabled="true">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>note Dark visual fixture</title>
    <link rel="stylesheet" href="../dark.css">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .m-navbarContainer { position: sticky; top: 0; display: flex; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #ddd; }
      .a-button[data-type="primary"] { display: inline-flex; gap: 4px; padding: 10px 16px; color: var(--color-text-invert); background: #e4eaed; border-radius: 8px; }
      .a-button[data-type="primary"] .a-button__inner { color: var(--color-text-invert); }
      .p-article__articleWrapper { max-width: 720px; margin: auto; padding: 48px 24px 80px; }
      .note-common-styles__textnote-body { font-size: 17px; line-height: 1.9; }
      pre { position: relative; padding: 24px; overflow: auto; border-radius: 8px; }
      blockquote { margin-inline: 0; padding: 12px 20px; border-left: 4px solid #aaa; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
      .external-article-widget { margin: 24px 0; padding: 18px; border: 1px solid #ddd; border-radius: 8px; }
      .feed-card { margin: 24px 0; padding: 18px; background: var(--color-surface-normal); }
      textarea { width: 100%; min-height: 90px; padding: 12px; }
    </style>
  </head>
  <body>
    <nav class="o-navBar m-navbarContainer">
      <span>note Dark 表示検証</span>
      <a class="a-button m-navbarPostButton" data-type="primary" href="/notes/new">
        <span class="a-button__inner">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 11.5V14h2.5L12 6.5 9.5 4 2 11.5Z"/></svg>
          投稿
        </span>
      </a>
    </nav>
    <main class="p-article">
      <article class="p-article__articleWrapper">
        <header class="o-noteContentHeader">
          <h1 class="o-noteContentHeader__title">ダークモードの記事タイトル</h1>
          <p class="o-noteContentHeader__date">2026年8月13日</p>
        </header>
        <div class="p-article__body">
          <div class="p-article__content note-common-styles__textnote-body">
            <h2>記事本文の見出し</h2>
            <p>通常の本文、<a href="#link">記事内リンク</a>、<code>inlineCode()</code> の配色をまとめて検証する。</p>
            <blockquote>引用部分は本文と区別でき、白い面が残らない。</blockquote>
            <pre data-name="preCode"><button class="m-copyCodeButton">コピー</button><code><span class="hljs-keyword">const</span> theme = <span class="hljs-string">"dark"</span>;
<span class="hljs-comment">// コードブロックも暗くする</span>
document.documentElement.dataset.mode = theme;</code></pre>
            <table>
              <thead><tr><th>対象</th><th>状態</th></tr></thead>
              <tbody><tr><td>コード</td><td>dark</td></tr><tr><td>表</td><td>dark</td></tr></tbody>
            </table>
            <section class="external-article-widget">
              <strong class="external-article-widget-title">外部記事カード</strong>
              <p class="external-article-widget-description">カードの説明文と境界線を検証する。</p>
            </section>
            <section class="feed-card bg-surface-normal [grid-row:2]">
              記事一覧のタイルは左右のページ背景と同色になる。
            </section>
            <label for="comment">コメント入力</label>
            <textarea id="comment" placeholder="コメントを書く"></textarea>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
